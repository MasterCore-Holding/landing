<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterCore · OAuth Callback</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#081125; color:#F8FAFC; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif; }
  .box { text-align:center; max-width:520px; padding:40px 24px; }
  .line { width:72px; height:4px; background:#14B8A6; margin:0 auto 28px; border-radius:2px; }
  h1 { font-size:22px; margin:0 0 12px; font-weight:700; }
  p { color:#CBD5E1; font-size:15px; line-height:1.6; margin:0 0 8px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:#0d1a33;
    border:1px solid #1e3a5f; border-radius:8px; padding:12px 14px; margin:20px 0;
    font-size:12px; color:#14B8A6; word-break:break-all; display:none; white-space:pre-wrap; }
  .ok { color:#14B8A6; } .err { color:#F87171; }
</style>
</head>
<body>
<div class="box">
  <div class="line"></div>
  <h1 id="title">Processando autorização…</h1>
  <p id="msg">Se esta janela não fechar sozinha, você já pode fechá-la e voltar ao chat do Córtex.</p>
  <div class="mono" id="info"></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(window.location.search);
  var info = document.getElementById('info');
  var title = document.getElementById('title');
  var msg = document.getElementById('msg');
  var parts = [];
  q.forEach(function(v,k){ parts.push(k+'='+v); });
  if (parts.length) { info.style.display='block'; info.textContent = parts.join('\n'); }
  if (q.get('error')) {
    title.textContent = 'Autorização não concluída';
    title.className = 'err';
    msg.textContent = 'Sem problema — volte ao chat do Córtex e tente de novo.';
  } else if (q.get('code')) {
    title.textContent = 'Autorização recebida ✓';
    title.className = 'ok';
    msg.textContent = 'Pode fechar esta janela e voltar ao chat do Córtex para colar este código.';
  }
  try { window.opener && window.opener.postMessage({type:'x-oauth-callback', params:Object.fromEntries(q)}, '*'); } catch(e){}
  if (q.get('code') || q.get('error')) { setTimeout(function(){ try{ window.close(); }catch(e){} }, 4000); }
})();
</script>
</body>
</html>
