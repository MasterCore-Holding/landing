<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Radar RFP — MasterCore · Versão interna (autenticada)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#081125; color:#F8FAFC; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .box { max-width:560px; width:100%; text-align:center; }
  .line { width:72px; height:4px; background:#3B82F6; margin:0 auto 32px; border-radius:2px; }
  .badge { display:inline-block; border:1px solid #3B82F6; color:#3B82F6; font-size:12px; letter-spacing:2px;
    padding:6px 16px; border-radius:999px; margin-bottom:28px; text-transform:uppercase; }
  h1 { font-size:clamp(26px,5vw,40px); line-height:1.15; font-weight:700; margin-bottom:14px; }
  p { color:#CBD5E1; font-size:16px; line-height:1.6; margin-bottom:10px; }
  .err { color:#F87171; font-size:14px; min-height:20px; margin:14px 0 8px; }
  .okline { color:#34D399; font-size:13px; margin:18px 0 10px; }
  .datapre { text-align:left; white-space:pre-wrap; background:#0D1B33; border:1px solid #1E3A5F; border-radius:10px;
    padding:18px; font-size:13px; color:#CBD5E1; margin-top:16px; }
  .sair { margin-top:16px; padding:8px 22px; background:transparent; color:#64748B; border:1px solid #1E3A5F;
    border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; }
  .sair:hover { color:#F8FAFC; border-color:#3B82F6; }
  #gbtn { display:flex; justify-content:center; margin-top:22px; min-height:44px; }
  .foot { margin-top:30px; font-size:12px; color:#64748B; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="box">
  <div class="line"></div>
  <div class="badge">MasterCore · Uso interno</div>
  <h1>Radar RFP</h1>
  <p>Monitor de oportunidades (RFPs, prêmios e chamadas) do Grupo MasterCore.</p>
  <p>Área interna — acesso controlado por conta Google autorizada.</p>
  <div id="gate">
    <div id="gbtn"></div>
    <div class="err" id="e"></div>
  </div>
  <div id="panel" style="display:none">
    <div class="okline" id="who"></div>
    <pre id="data" class="datapre">Carregando…</pre>
    <button class="sair" onclick="sair()">Sair</button>
  </div>
  <div class="foot">Grupo MasterCore · control plane</div>
</div>
<script>
var HUB='https://master-core-hub.base44.app/api/apps/6ac33e5bd58233f964488e87/functions/radarGate';
var SES='mc_radar_session', CRED='mc_radar_cred';
function sair(){ try{localStorage.removeItem(SES);}catch(e){} try{sessionStorage.removeItem(CRED);}catch(e){} location.reload(); }
function showRadar(email, cred){
  document.getElementById('gate').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('who').textContent='Sessão ativa: '+email;
  var pre=document.getElementById('data');
  fetch(HUB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:cred,action:'data'})})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ pre.textContent = (d.data && d.data.length) ? d.data : 'Base do Radar ainda não sincronizada — o conteúdo aparecerá aqui na primeira sincronização.'; })
    .catch(function(){ pre.textContent='Indisponível — tente novamente.'; });
}
function onCred(resp){
  var cred=resp.credential;
  fetch(HUB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:cred})})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(x){
      if(x.ok && x.d.ok){
        try{ localStorage.setItem(SES, JSON.stringify({email:x.d.email, exp:Date.now()+12*3600*1000})); sessionStorage.setItem(CRED, cred);}catch(e){}
        showRadar(x.d.email, cred);
      } else if(x.d && x.d.error==='acesso_nao_autorizado'){ document.getElementById('e').textContent='Acesso não autorizado.'; }
      else { document.getElementById('e').textContent='Não foi possível concluir o login — tente novamente.'; }
    })
    .catch(function(){ document.getElementById('e').textContent='Indisponível — tente novamente.'; });
}
function boot(){
  var sess=null, cred=null;
  try{ sess=JSON.parse(localStorage.getItem(SES)||'null'); }catch(e){}
  try{ cred=sessionStorage.getItem(CRED); }catch(e){}
  if(sess && cred && sess.exp>Date.now()){ showRadar(sess.email, cred); return; }
  try{ localStorage.removeItem(SES); }catch(e){}
  fetch(HUB).then(function(r){ return r.json(); }).then(function(cfg){
    if(!cfg.ready){ document.getElementById('e').textContent='Autenticação Google em configuração final — volte em instantes.'; return; }
    google.accounts.id.initialize({ client_id: cfg.client_id, callback: onCred });
    google.accounts.id.renderButton(document.getElementById('gbtn'), {theme:'filled_blue', size:'large', text:'signin_with', shape:'pill', locale:'pt-BR'});
  }).catch(function(){ document.getElementById('e').textContent='Indisponível — tente novamente.'; });
}
window.addEventListener('load', boot);
</script>
</body>
</html>
