<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dashboard de Custos — MasterCore · Acesso Restrito</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#081125; color:#F8FAFC; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .box { max-width:560px; width:100%; text-align:center; }
  .line { width:72px; height:4px; background:#3B82F6; margin:0 auto 32px; border-radius:2px; }
  .badge { display:inline-block; border:1px solid #3B82F6; color:#3B82F6; font-size:12px; letter-spacing:2px;
    padding:6px 16px; border-radius:999px; margin-bottom:28px; text-transform:uppercase; }
  h1 { font-size:clamp(26px,5vw,40px); line-height:1.15; font-weight:700; margin-bottom:14px; }
  p { color:#CBD5E1; font-size:16px; line-height:1.6; margin-bottom:10px; }
  input { width:100%; padding:14px 16px; margin:22px 0 14px; background:#0D1B33; border:1px solid #1E3A5F;
    border-radius:10px; color:#F8FAFC; font-size:16px; text-align:center; outline:none; }
  input:focus { border-color:#3B82F6; }
  button { width:100%; padding:14px; background:#3B82F6; color:#FFFFFF; border:0; border-radius:10px;
    font-weight:700; font-size:16px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .err { color:#F87171; font-size:14px; min-height:20px; margin-bottom:8px; }
  .foot { margin-top:30px; font-size:12px; color:#64748B; }
</style>
</head>
<body>
<div class="box">
  <div class="line"></div>
  <div class="badge">MasterCore · Uso interno</div>
  <h1>Dashboard de Custos</h1>
  <p>Telemetria de despesas e consumo do Grupo MasterCore.</p>
  <p>Área interna — acesso controlado.</p>
  <input id="k" type="password" placeholder="Chave de acesso" autocomplete="off" onkeydown="if(event.key==='Enter')go()">
  <div class="err" id="e"></div>
  <button onclick="go()">Entrar</button>
  <div class="foot">Grupo MasterCore · control plane</div>
</div>
<script>
function go(){
  var k=document.getElementById('k').value.trim();
  if(!k){document.getElementById('e').textContent='Digite a chave.';return;}
  sessionStorage.setItem('mc_custos_key',k);
  load();
}
function load(){
  var k=sessionStorage.getItem('mc_custos_key')||'';
  fetch('custos-data.json',{cache:'no-store'}).then(function(r){
    if(r.status===403){throw 0;}
    if(!r.ok){throw 1;}
    return r.text();
  }).then(function(t){
    document.getElementById('e').textContent='';
    var pre=document.createElement('pre');
    pre.style.cssText='text-align:left;white-space:pre-wrap;background:#0D1B33;border:1px solid #1E3A5F;border-radius:10px;padding:18px;font-size:13px;color:#CBD5E1;margin-top:24px;';
    pre.textContent=t;
    document.body.querySelector('.box').appendChild(pre);
  }).catch(function(x){
    if(x===0){
      document.getElementById('e').textContent='Chave inválida.';
      sessionStorage.removeItem('mc_custos_key');
    } else {
      document.getElementById('e').textContent='Indisponível — tente novamente.';
    }
  });
}
if(sessionStorage.getItem('mc_custos_key')){load();}
</script>
</body>
</html>
